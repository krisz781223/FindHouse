name: Napi házkeresés

on:
  schedule:
    - cron: "17 4 * * *"   # minden nap 06:17 (nyári idő) / 05:17 (téli idő) magyar idő szerint
  workflow_dispatch: {}      # kézi indítás az Actions fülön

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m findhouse
      - name: Commit results
        run: |
          git config user.name "findhouse-bot"
          git config user.email "findhouse-bot@users.noreply.github.com"
          git add data/state.json docs/
          git diff --cached --quiet || git commit -m "Napi frissítés $(date +%F)"
          git push
